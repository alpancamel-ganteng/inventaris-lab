services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventaris-lab:sec-0.2
    container_name: inventaris-lab
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in environment}"
      DATABASE_PATH: "/data/inventory.db"
      SEED_DEMO_USERS: "1"
      COOKIE_SECURE: "0"
    expose:
      - "8000"
    volumes:
      - inventory_data:/data
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app_internal

volumes:
  inventory_data:

networks:
  app_internal:
    driver: bridge
    internal: true
